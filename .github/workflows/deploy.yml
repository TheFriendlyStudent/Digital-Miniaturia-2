name: Deploy Quartz Wiki
on:
  push:
    branches:
      - main

# Opts into Node 24 for the internal GitHub Action runners to silence deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exclude Templates
        run: rm -rf "obsidian-vault/_Templates"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Using Node 24 as requested by the environment
          cache: 'npm'
          cache-dependency-path: quartz/package-lock.json

      - name: Install Dependencies
        working-directory: quartz
        run: npm install

      - name: Build Quartz
        working-directory: quartz
        # npx --package forces the runner to use the actual package binary
        # and avoids the naming conflict with your 'quartz' folder.
        run: npx --package @jackyzha0/quartz quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
